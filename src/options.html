<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>便捷搜索 - 设置</title>
    <link rel="stylesheet" href="css/options.css">
</head>
<body>
    <div class="page">
        <header class="topbar">
            <a class="brand" href="https://lemontree.one/docs/quicksearch/" target="_blank" rel="noopener noreferrer">
                <img src="img/icon-48.png" alt="" width="32" height="32">
                <span>便捷搜索</span><span class="brand-label">设置</span>
            </a>
            <a class="guide-link" href="https://lemontree.one/docs/quicksearch/" target="_blank" rel="noopener noreferrer">使用指南 ↗</a>
        </header>

        <main>
            <fieldset id="settingsEditor" disabled>
                <section class="panel" aria-labelledby="enginesTitle">
                    <div class="panel-heading">
                        <div><h2 id="enginesTitle">搜索引擎 <span class="count" id="engineCount">—</span></h2>
                            <p>拖动左侧手柄调整顺序，保存后同步到弹窗与右键菜单。</p></div>
                        <button type="button" class="button button-soft" id="addCustomSearch"><span aria-hidden="true">＋</span> 添加搜索引擎</button>
                    </div>
                    <div class="list-head" aria-hidden="true"><span></span><span>名称</span><span>搜索网址</span><span>启用</span><span></span></div>
                    <div id="engineList" class="engine-list" aria-label="搜索引擎列表">
                        <p class="empty-state">正在读取设置…</p>
                    </div>
                    <div class="list-help"><span class="hint-icon" aria-hidden="true">i</span>
                        <p>网址中的搜索关键词请替换为 <code>%s</code>，例如 <span class="example-url">https://www.baidu.com/s?wd=%s</span>。<br>
                            <span class="secondary-text">也可以聚焦拖拽手柄，按 Alt + ↑ / ↓ 调整顺序。</span></p>
                    </div>
                </section>

                <section class="panel" aria-labelledby="preferencesTitle">
                    <div class="panel-heading"><h2 id="preferencesTitle">搜索偏好</h2></div>
                    <label class="preference" for="openInNewTab">
                        <strong>在新标签页打开</strong>
                        <span class="toggle"><input type="checkbox" id="openInNewTab"><span class="toggle-track"></span></span>
                    </label>
                </section>

                <section class="panel data-panel" aria-labelledby="dataTitle">
                    <div><h2 id="dataTitle">导入与导出</h2><p>备份你的搜索配置。导入后，点击保存设置即可生效。</p></div>
                    <div class="data-actions">
                        <button type="button" class="button button-outline" id="backupData">导出配置</button>
                        <button type="button" class="button button-outline" id="restoreData">导入配置</button>
                        <input type="file" id="importFile" accept=".json,application/json" hidden>
                    </div>
                </section>
            </fieldset>
        </main>

        <footer class="footer">
            <span id="version"></span>
            <div class="footer-links">
                <a href="https://github.com/lemon-codehub/SearchCrutch" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
                <a href="https://x.com/nodotbtree" target="_blank" rel="noopener noreferrer">关注开发者 ↗</a>
            </div>
        </footer>
    </div>

    <dialog id="catalogDialog" class="catalog-dialog" aria-labelledby="catalogTitle">
        <div class="catalog-header">
            <div><h2 id="catalogTitle">添加搜索引擎</h2><p>找到常用的搜索引擎，一次添加多个。</p></div>
            <button type="button" class="icon-button catalog-close" id="closeCatalog" aria-label="关闭">×</button>
        </div>
        <div class="catalog-toolbar">
            <input type="search" id="catalogQuery" class="engine-input" placeholder="搜索名称、分类或网站" aria-label="搜索可添加的搜索引擎">
            <button type="button" class="button button-outline" id="refreshCatalog">刷新列表</button>
        </div>
        <div id="catalogCategories" class="catalog-categories" aria-label="按分类筛选"></div>
        <p id="catalogStatus" class="catalog-status" role="status" aria-live="polite"></p>
        <div id="catalogList" class="catalog-list" aria-label="可添加的搜索引擎"></div>
        <div class="catalog-footer">
            <button type="button" class="button button-outline" id="addManualSearch">手动添加</button>
            <button type="button" class="button button-primary" id="addSelectedEngines" disabled>添加所选</button>
        </div>
    </dialog>

    <div class="save-bar">
        <div class="save-bar-inner">
            <div class="save-message"><span class="status-dot" id="statusDot" aria-hidden="true"></span><p id="saveStatus" role="status" aria-live="polite">正在读取设置…</p></div>
            <button type="button" class="button button-primary" id="saveSettings" disabled>保存设置</button>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/catalog.js"></script>
    <script src="js/options.js"></script>
</body>
</html>
